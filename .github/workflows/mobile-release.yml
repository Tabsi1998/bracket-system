name: Mobile APK Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options:
          - alpha
          - beta
          - stable
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Mobile release preflight
        working-directory: mobile
        run: npm run release:preflight

      - name: Typecheck mobile app
        working-directory: mobile
        run: npm run typecheck

      - name: Validate Expo SDK compatibility
        working-directory: mobile
        run: |
          npm run audit:ci
          npx expo install --check
          npx expo-doctor

      - name: Resolve release metadata
        id: meta
        working-directory: mobile
        shell: bash
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "app.json version ($VERSION) and package.json version ($PACKAGE_VERSION) differ" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" == *"alpha"* ]]; then
              CHANNEL="alpha"
            elif [[ "${GITHUB_REF_NAME}" == *"beta"* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          else
            CHANNEL="${{ inputs.channel }}"
          fi
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          DISPLAY_VERSION="${VERSION%%-*}"
          CHANNEL_LABEL="${CHANNEL^^}"
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$CHANNEL" = "stable" ]; then
            APK_NAME="LionsAPP-v${DISPLAY_VERSION}-build${VERSION_CODE}-${SHORT_SHA}.apk"
            RELEASE_NAME="LionsAPP v${DISPLAY_VERSION} (Build ${VERSION_CODE})"
          else
            APK_NAME="LionsAPP-${CHANNEL_LABEL}-v${DISPLAY_VERSION}-build${VERSION_CODE}-${SHORT_SHA}.apk"
            RELEASE_NAME="LionsAPP ${CHANNEL_LABEL} v${DISPLAY_VERSION} (Build ${VERSION_CODE})"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "channel_label=$CHANNEL_LABEL" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: "1"
          REQUIRE_ANDROID_PUSH_CONFIG: "1"
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          node scripts/prepare-google-services.cjs
          npx expo prebuild --platform android --clean

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android release signing
        working-directory: mobile
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Android release signing secrets: ${missing[*]}"
            echo "GitHub releases must be signed with the stable LionsAPP upload key."
            echo "Set these as Repository secrets in Settings -> Secrets and variables -> Actions."
            echo "Do not store them as Variables and do not store them only in an Environment unless this workflow is configured to use that Environment."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo ""
            echo "TLS_UPLOAD_STORE_FILE=release.keystore"
            echo "TLS_UPLOAD_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "TLS_UPLOAD_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "TLS_UPLOAD_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> android/gradle.properties
          node scripts/configure-android-signing.cjs

      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Stage APK
        working-directory: mobile
        run: |
          mkdir -p builds
          cp android/app/build/outputs/apk/release/app-release.apk "builds/${{ steps.meta.outputs.apk_name }}"
          ls -lh "builds/${{ steps.meta.outputs.apk_name }}"

      - name: Verify APK signature and checksum
        working-directory: mobile
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "builds/${{ steps.meta.outputs.apk_name }}" | tee "builds/${{ steps.meta.outputs.apk_name }}.signature.txt"
          if grep -q "CN=Android Debug" "builds/${{ steps.meta.outputs.apk_name }}.signature.txt"; then
            echo "::error::APK is signed with the Android debug certificate."
            exit 1
          fi
          sha256sum "builds/${{ steps.meta.outputs.apk_name }}" > "builds/${{ steps.meta.outputs.apk_name }}.sha256"

      - name: Generate release notes
        id: notes
        working-directory: mobile
        shell: bash
        run: |
          NOTES_FILE="builds/release-notes.md"
          VERSION="${{ steps.meta.outputs.version }}"
          APK_NAME="${{ steps.meta.outputs.apk_name }}"
          SHA256="$(cut -d ' ' -f 1 "builds/${APK_NAME}.sha256")"
          SIGNER="$(grep -m 1 -E "Signer #1 certificate DN|V[0-9]+ Signer: certificate DN" "builds/${APK_NAME}.signature.txt" | sed -E 's/^Signer #1 certificate DN: //; s/^V[0-9]+ Signer: certificate DN: //' || true)"
          SIGNER_SHA="$(grep -m 1 -E "Signer #1 certificate SHA-256 digest|V[0-9]+ Signer: certificate SHA-256 digest" "builds/${APK_NAME}.signature.txt" | sed -E 's/^Signer #1 certificate SHA-256 digest: //; s/^V[0-9]+ Signer: certificate SHA-256 digest: //' || true)"
          SIGNER="${SIGNER:-unknown}"
          SIGNER_SHA="${SIGNER_SHA:-unknown}"
          {
            echo "# LionsAPP v${VERSION}"
            echo ""
            echo "**Release:** ${{ steps.meta.outputs.release_name }}"
            echo ""
            echo "**Channel:** \`${{ steps.meta.outputs.channel }}\`"
            echo ""
            echo "**Internal version:** \`${VERSION}\`"
            echo ""
            echo "**Android build:** \`${{ steps.meta.outputs.version_code }}\`"
            echo ""
            echo "**APK:** \`${APK_NAME}\`"
            echo ""
            echo "**SHA-256:** \`${SHA256}\`"
            echo ""
            echo "**Signer:** \`${SIGNER}\`"
            echo ""
            echo "**Signer SHA-256:** \`${SIGNER_SHA}\`"
            echo ""
            echo "## Changelog"
            echo ""
            awk -v ver="$VERSION" '
              $0 ~ /^## / {
                if (found) exit
                found = index($0, ver) > 0
                next
              }
              found { print }
            ' CHANGELOG.md
            echo ""
            echo "## Installation"
            echo ""
            echo "Diese APK ist eine ${{ steps.meta.outputs.channel_label }}-Testversion. Bei Installation ausserhalb von Google Play kann Android weiterhin Hinweise zu externen Quellen oder Play Protect anzeigen. Fuer die sauberste Installation ohne Sideload-Warnung muss dieselbe App ueber Google Play Testing verteilt werden."
          } > "$NOTES_FILE"
          echo "notes_file=mobile/${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: |
            mobile/builds/${{ steps.meta.outputs.apk_name }}
            mobile/builds/${{ steps.meta.outputs.apk_name }}.sha256
            mobile/builds/${{ steps.meta.outputs.apk_name }}.signature.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.channel != 'stable' }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            mobile/builds/${{ steps.meta.outputs.apk_name }}
            mobile/builds/${{ steps.meta.outputs.apk_name }}.sha256
            mobile/builds/${{ steps.meta.outputs.apk_name }}.signature.txt
